<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e15" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <!--
      PWA manifest link (audit U6). @vite-pwa generates manifest.webmanifest into
      the build output but does NOT inject this link, so Chromium never saw the
      app as installable — `beforeinstallprompt` never fired and the Android
      install path stayed hidden. `%sveltekit.assets%` resolves to the base path
      (empty locally, "/app" in production, matching the favicon above), so this
      is correct for both `vite preview` and the BASE_PATH=/app production build.
      CSP already allows it (manifest-src 'self').
    -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <!--
      Anti-FOUC theme resolution (item 3 / UX-40). This runs SYNCHRONOUSLY before
      the body paints, so the very first frame already carries the user's real
      theme — a light-preferring visitor never gets the hardcoded-dark flash the
      static `data-theme="dark"` below would otherwise cause while the JS bundle
      (theme store) is still loading. Mirrors stores/theme.svelte.ts exactly:
      same STORAGE_KEY, same "system"→prefers-color-scheme resolution, same
      --bg colours for the address-bar meta. The theme store re-applies the same
      value on mount, so this is a pure first-paint accelerator, not a second
      source of truth. Wrapped in try/catch: any failure falls back to the static
      dark attribute — identical to today's behaviour.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("nostrautica:theme");
          if (saved !== "dark" && saved !== "light" && saved !== "system") saved = "system";
          var dark =
            saved === "dark" ||
            ((saved === "system" || !saved) &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = dark ? "#0e0e15" : "#fafafc";
        } catch (e) {
          var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", systemDark ? "dark" : "light");
        }
      })();
    </script>
    <!--
      Cold-boot splash (item 3): an instant, branded static shell so first
      contentful paint happens BEFORE the JS bundle executes (~0.4-0.8s on a good
      network, worse at venues). It's plain inline CSS + markup — no fonts, no
      bundle, no relay — so it paints in the first frame. The app removes
      #app-splash on mount (routes/+layout.svelte). Theme-aware via the
      data-theme set by the script above, with a prefers-color-scheme fallback so
      the splash itself never flashes the wrong colour if that script was skipped.
    -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.15rem;
        background: #0e0e15;
        color: #ededf4;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.28s ease;
        animation: splash-failsafe 0s 15s forwards;
      }
      [data-theme="light"] #app-splash {
        background: #fafafc;
        color: #17171f;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme="dark"]) #app-splash {
          background: #fafafc;
          color: #17171f;
        }
      }
      #app-splash .splash-logo {
        width: 60px;
        height: 60px;
      }
      #app-splash .splash-name {
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      #app-splash .splash-bar {
        width: 128px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(124, 92, 255, 0.22);
      }
      #app-splash .splash-bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 38%;
        border-radius: 999px;
        background: #7c5cff;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @keyframes splash-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-bar::after {
          animation: none;
          width: 100%;
          opacity: 0.55;
        }
      }
      /* Belt-and-braces: if JS ever fails to remove it, the fade class still
         takes it out of the way (display:none) so it can't wedge over the app. */
      #app-splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <!-- Social preview (shares the branded OG card with the landing page) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nostrautica" />
    <meta property="og:url" content="https://nostrautica.cypherpunk.today/app" />
    <meta property="og:title" content="Nostrautica — meet the right people at events" />
    <meta
      property="og:description"
      content="Nostr-native matchmaking: record a short intro, get an AI-written list of who to meet and why, and keep a real portable Nostr identity."
    />
    <meta property="og:image" content="https://nostrautica.cypherpunk.today/assets/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nostrautica" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nostrautica — meet the right people at events" />
    <meta name="twitter:description" content="Nostr-native matchmaking for any event." />
    <meta name="twitter:image" content="https://nostrautica.cypherpunk.today/assets/og-card.png" />
    <!--
      CSP (spec §14). The real goal is blocking THIRD-PARTY/external scripts and
      limiting network to relays (wss) + Blossom (https) — enforced by the absence
      of any external host in script-src/connect-src. 'unsafe-inline' is allowed for
      scripts so SvelteKit's inline bootstrap runs AND NIP-07 signer extensions
      (which inject inline content scripts) keep working; the app uses no {@html},
      so there is no untrusted-HTML injection vector. Kept as a meta so it applies
      on any dumb static host and on nsite.

      font-src 'self' is a hard invariant (audit APPR-5): themed event routes
      (chat/admin) render key material (invite nsecs), and CSS text-exfiltration
      needs a REMOTE font — pinning fonts to same-origin keeps that exfil channel
      shut even if another directive ever drifts open.

      media-src includes https: because posts render inline <video> from Blossom
      (APPR-11/UX-5); object-src/base-uri/form-action are belt-and-braces for a
      client-side app with no plugins, no <base>, and no form posts.

      frame-src is pinned to youtube-nocookie.com ONLY: a talk's video can be an
      unlisted YouTube link (external talk source, 2026-07-24), embedded via the
      privacy no-cookie host. No other origin may be framed — direct-mp4 external
      talks render as a same-origin <video src=https:…> under media-src, not a frame.

      WARNING: PUBLIC_CSP_EXTRA_CONNECT must NEVER be set in production builds
      (APPR-11). Local e2e builds (VITE_NOSTRAUTICA_* overrides) set
      PUBLIC_CSP_EXTRA_CONNECT=" ws: http:" because plain-scheme localhost infra
      is otherwise blocked; unset, the substitution is empty and production CSP
      is unchanged.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://www.youtube-nocookie.com; img-src 'self' https:%sveltekit.env.PUBLIC_CSP_EXTRA_CONNECT% data: blob:; media-src 'self' blob: https:; connect-src 'self' wss: https:%sveltekit.env.PUBLIC_CSP_EXTRA_CONNECT%; worker-src 'self' blob:; manifest-src 'self'"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Cold-boot splash — removed on mount by routes/+layout.svelte. Sits as a
         body-level sibling of the SvelteKit mount target so hydration never
         touches it. aria-hidden: it's a purely visual loading affordance. -->
    <div id="app-splash" aria-hidden="true">
      <svg class="splash-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nostrautica">
        <rect width="64" height="64" rx="14" fill="#0b0b12" />
        <path
          d="M32 12l4.9 12.4L50 26l-9 8.6 2.4 13.4L32 41.6 20.6 48 23 34.6 14 26l13.1-1.6z"
          fill="#7c5cff"
        />
      </svg>
      <div class="splash-name">Nostrautica</div>
      <div class="splash-bar"></div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
