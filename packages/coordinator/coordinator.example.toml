# Nostrautica coordinator configuration (spec §9.5).
# Installation is protocol-level (a 21603 grant from an organizer) — there is no
# per-event server config here, only the daemon's identity, providers, and knobs.

[identity]
# Provide the secret key via env NOSTRAUTICA_COORDINATOR_NSEC (nsec or 64-hex),
# or point at an NIP-49 encrypted key file and set NOSTRAUTICA_COORDINATOR_PASSPHRASE.
ncryptsec_file = "coordinator.ncryptsec"

[relays]
# relay.damus.io dropped (2026-07-20): heavily rate-limited, was causing
# key-package discovery failures. Whitenoise's own relays added so its
# clients' 30443 key packages are found even when an event's own relay list
# doesn't include them (fallback tier — see key-package-discovery.ts).
default = ["wss://nostr.cypherpunk.today", "wss://relay.primal.net", "wss://nos.lol", "wss://relay.us.whitenoise.chat", "wss://relay.eu.whitenoise.chat"]

[providers.venice]
api_key_env = "VENICE_API_KEY"
require_private = true            # default privacy policy: private/TEE-tier models only;
                                  # overridable per role via models.<role>.require_private

# [providers.routstr]              # optional experimental global LLM provider
# node_url = "https://api.routstr.com/v1"
# mint = "https://mint.example"
# wallet_db = "cashu-wallet.sqlite"

[stt]
provider = "venice-stt"           # only implemented STT provider
model = "openai/whisper-large-v3"

# Resolve these against GET /models at runtime — never hardcode volatile ids.
#
# Any [models.*] block also accepts `disable_thinking = false`, for a model that
# reasons unconditionally. The adapter otherwise sends
# `venice_parameters.disable_thinking: true` on every call, and a model that
# refuses it answers HTTP 400 "Reasoning is mandatory for this endpoint and
# cannot be disabled" to EVERY request — a total outage for that role, not a
# degraded result. `z-ai-glm-5-3-flash` is the first model to do this (and it
# refuses `reasoning_effort = "none"` as well, despite GET /models advertising
# "none" as supported — so the catalogue cannot be trusted for this one field).
#
# Setting it is optional: the adapter detects the refusal on the first call,
# remembers it for the process and retries without the parameter. Setting it
# explicitly just skips that one wasted call at startup. Budget for the reasoning
# tokens either way — they are billed even though `strip_thinking_response` keeps
# them out of the content. See docs/MODEL-BAKEOFF.md.
[models.summary]
provider = "venice"
model = "qwen3-4b"                # cheap: nostr-context summaries

[models.match]
provider = "venice"
model = "deepseek-v4-flash-0731"  # successor to the matching-benchmark winner
                                  # (docs/MATCHING-BENCHMARK.md): best recall@1 + separation,
                                  # judge 4.53, ~45× cheaper than glm-5-2 pairwise
                                  # (~$0.28/100 attendees at 0731 pricing, batched K=10).
# Venice deprecated the benchmarked `deepseek-v4-flash` (0423) on 2026-08-14 with
# autoRemap:false — i.e. it does not silently redirect, the id just stops existing —
# naming `deepseek-v4-flash-0731` as the replacement. Re-benchmarked before the swap
# (BP3/K=10/subset, 2 seeds): recall@1 0.75, zero format failures, separation 0.59-0.62
# vs 0.64-0.65 — weak pairs score ~5 points higher, which only softens the margin, not
# the ranking (o>W 0.98-0.99 unchanged, and matches are rank-based via top_k).
# TRADE-OFF: 0423 was NOT private-tier, which is what require_private = false below is
# for. 0731 reports privacy = "private" in GET /models (though supportsTeeAttestation is
# still false), so this override is now a compatibility valve rather than a live policy
# relaxation — it is kept because a Venice-side reclassification would otherwise turn
# into a hard startup error for the whole daemon. summary/embed/STT keep the provider
# default above. Private-tier alternatives if you drop this role's override entirely:
# "zai-org-glm-5-2" (judge 4.63, $2.64/100) or budget "zai-org-glm-4.7-flash"
# ($0.32/100, softer separation).
require_private = false

[models.embed]
provider = "venice"
model = "text-embedding-bge-m3"

[matching]
prefilter_threshold = 50          # below this many attendees, score everyone
prefilter_top_m = 30              # top-M by cosine similarity
prefilter_random = 10             # random low-similarity slice (complementarity!)
top_k = 20                        # matches per attendee list
batch_size = 10                   # candidates per batched scoring call (benchmark K=10)

# ── Discovery announcement (kind 31611, docs/COORDINATOR-DISCOVERY-PLAN.md) ──────
# Published on boot so organizers can PICK this coordinator in the app instead of
# pasting its npub. Set announce = false to stay paste-only (unlisted).
[coordinator]
announce = true
name = "Nostrautica coordinator"
# about = "AI matchmaking for freedom-tech events."
# picture = "https://…/logo.png"
# operator = "npub1… or a contact string"
# terms_url = "https://…/terms"

# ── Billing policy — payment is NOT handled or enforced yet. The current daemon ──
# evaluates this at install and logs it; it is not an admission gate. Default: free.
[pricing]
model = "free"                    # free | per_user | per_event | negotiated | external
# free_up_to_users = 20           # optional soft/hard free tier
# summary = "Up to 20 attendees free; larger events by quote."
# checkout_url = "https://…/checkout"   # the app appends ?event=<naddr>
# currency = "sats"
# free_organizers = ["<E_id hex pubkey>"] # always-free E_id allowlist; PRIVATE.

# ── Daemon-side security policy ───────────────────────────────────────────────
# Installation is protocol-level (any E_id can gift-wrap a 21603 grant to this
# daemon), so unsolicited installs are bounded here.
[security]
max_events = 50                   # reject installs beyond this many simultaneous events
# allowed_eid_pubkeys = ["<hex>"]  # when non-empty, ONLY install events whose
                                  # E_id (hex pubkey) is listed (private coordinator)
# allow_unverified_model_privacy = true
                                  # escape hatch (default false = fail CLOSED):
                                  # boot even when GET /models can't be fetched
                                  # while a role has require_private set
