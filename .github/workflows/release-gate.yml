name: Release gate

# The single supported release gate (audit R15). Runs the machine-checkable
# guardrails, the unit suite, the SUPPORTED e2e path (the orchestrator, not a
# bespoke Playwright invocation), the docs build + link tests, and a clean-context
# coordinator Docker build — the same things docs/DEPLOYMENT.md's release
# verification requires, enforced in CI so they can't silently rot.
#
# Reusable so both push/PR CI (.github/workflows/ci.yml) and tagged deploy
# (.github/workflows/deploy.yml) run the IDENTICAL gate. Every third-party action
# is pinned to a commit SHA (audit R15): a moving major tag can't swap the code
# under us. The trailing `# vX.Y.Z` comment records which release each SHA is.
on:
  workflow_call:

jobs:
  # Guardrail (audit Q14): fail on inconsistent Node majors or mutable infra tags,
  # so runtime/image declarations can't silently drift apart again.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assert one Node major and no mutable infrastructure tags
        run: node .github/scripts/check-pins.mjs
      # The vendored MLS/Marmot engine is committed BUILT OUTPUT with no source and
      # no lockfile entry, so nothing else in this gate looks at those bytes. This
      # does not prove they match upstream — it makes a change to them impossible to
      # land without someone deciding to.
      - name: Assert the vendored crypto has not changed unnoticed
        run: node scripts/vendor-manifest.mjs --check

  build:
    runs-on: ubuntu-latest
    needs: pins
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nostrautica/protocol build
      - run: pnpm check
      - run: pnpm --filter @nostrautica/app build
      # Build the app AGAIN the way production builds it (audit CI-1). The step
      # above builds at base "/", which is the local-preview shape; the deployed
      # site is served from a subdirectory and the post-receive hook on the build
      # host runs `BASE_PATH=/app pnpm --filter @nostrautica/app build`. Anything
      # that only breaks under a non-empty base — an absolute asset URL, a service
      # worker registered outside its scope, a manifest start_url pointing at the
      # domain root — passed this gate and broke production, because the gate had
      # never once built the artifact production actually serves.
      #
      # The assertions matter as much as the build: a base-path regression usually
      # SUCCEEDS at building and simply emits the wrong URLs, so a green `build` is
      # not evidence. These check the three files whose paths are resolved at build
      # time rather than by the browser.
      - name: Production build (BASE_PATH=/app) with base-path assertions
        run: |
          set -euo pipefail
          BASE_PATH=/app pnpm --filter @nostrautica/app build
          out=packages/app/build
          test -f "$out/index.html" || { echo "::error::no index.html emitted"; exit 1; }
          # The manifest's URLs are RELATIVE by design so one artifact serves from
          # any base. What must never appear is a root-absolute URL outside /app/:
          # that resolves to the domain root and silently takes the installed PWA
          # to the landing page instead of the app.
          node -e '
            const m = JSON.parse(require("node:fs").readFileSync("packages/app/build/manifest.webmanifest", "utf8"));
            const urls = [m.start_url, m.scope, m.id, ...(m.icons ?? []).map((i) => i.src)].filter(Boolean);
            const bad = urls.filter((u) => u.startsWith("/") && !u.startsWith("/app/"));
            if (bad.length) {
              console.error(`::error::manifest.webmanifest has root-absolute URL(s) outside /app/: ${bad.join(", ")}`);
              process.exit(1);
            }
            console.log(`manifest URLs are base-relative or /app/-scoped: ${urls.join(" ")}`);
          '
          grep -q '/app/index.html' "$out/sw.js" \
            || { echo "::error::service worker navigateFallback is not /app/-scoped — every deep link would fall back to the wrong shell"; exit 1; }
          grep -q '/app/_app/' "$out/index.html" \
            || { echo "::error::index.html does not reference /app/_app/ — the JS/CSS bundles would 404 in production"; exit 1; }
          echo "base-path assertions passed"
      # High-severity dependency advisories fail the gate (audit R16 keeps this in CI).
      - run: pnpm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The orchestrator builds the app/coordinator itself, but it imports from the
      # protocol package's dist — build that first.
      - run: pnpm --filter @nostrautica/protocol build
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      # All three engines: the smoke tier runs chromium+firefox+webkit (audit U18),
      # the relay/chat tiers run chromium. `--with-deps` installs the system libs.
      - run: pnpm --filter @nostrautica/e2e exec playwright install --with-deps chromium firefox webkit
      # The SUPPORTED path (audit R15). The orchestrator stands up relay + Blossom +
      # HTTPS/WSS proxies + the real Marmot coordinator double, sets every env marker
      # the specs gate on (NOSTRAUTICA_E2E_RELAY, ..._COORDINATOR_NPUB), and FAILS
      # LOUDLY if any piece is unhealthy — chat scenarios can't silently skip.
      #   smoke : chromium+firefox+webkit, static-load smoke specs (engine coverage).
      #   full  : chromium, smoke+integration+chat specs (the real relay/media/chat loop).
      - run: pnpm e2e:smoke
      - run: pnpm e2e:full

  docs:
    runs-on: ubuntu-latest
    needs: pins
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Docs generator path handling + internal link/anchor checks (audit O6/O7).
      - run: node --test scripts/build-docs.test.mjs
      # Full site build: emits every page and fails on a broken internal link/anchor.
      - run: node scripts/build-docs.mjs

  docker:
    runs-on: ubuntu-latest
    needs: pins
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Clean-context coordinator image build (audit O1). `git archive` strips the
      # working tree AND `.git`, proving the Dockerfile resolves everything it needs
      # from committed sources alone — the exact release-verification build in
      # docs/DEPLOYMENT.md. Provenance args are passed from git so the image carries
      # a real release id/SHA (audit R23) rather than `gitSha: unknown`.
      - name: Clean-context coordinator Docker build
        run: |
          set -euo pipefail
          rel="$(git describe --tags --always --dirty)"
          sha="$(git rev-parse HEAD)"
          ts="$(git show -s --format=%cI HEAD)"
          rm -rf /tmp/cc && mkdir -p /tmp/cc
          git archive HEAD | tar -x -C /tmp/cc
          docker build -f docker/coordinator.Dockerfile \
            --build-arg RELEASE_ID="$rel" \
            --build-arg GIT_SHA="$sha" \
            --build-arg BUILD_TIMESTAMP="$ts" \
            -t nostrautica-coordinator:ci /tmp/cc
