name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI is exactly the release gate (audit R15): guardrails, unit suite, the supported
# e2e orchestrator path, docs build + tests, and the clean-context coordinator Docker
# build. Reusing one workflow means a PR is checked against the same bar a tagged
# release must clear — no CI-vs-release drift.
jobs:
  gate:
    uses: ./.github/workflows/release-gate.yml
