packages:
  - "packages/*"
  - "packages/vendor/*"
  - "e2e"
allowBuilds:
  better-sqlite3: true
  esbuild: true
patchedDependencies:
  tseep@1.3.1: patches/tseep@1.3.1.patch
# Security advisory remediations (audit §6 "Dependencies", items 1–2). Both are
# transitive, build-time-only, low real reachability on a static deploy, but are
# known high/low advisories — pull them up through the Workbox/AJV and SvelteKit
# chains. fast-uri: host-confusion (GHSA, patched ≥3.1.4). cookie: name/path/domain
# validation (patched ≥0.7.0).
overrides:
  # postcss: source-map path traversal / .map disclosure (GHSA-r28c-9q8g-f849,
  # patched >=8.5.18) — build-time only on a static deploy, but the high gate fails.
  postcss: ">=8.5.18"
  fast-uri: "^3.1.4"
  cookie: "^0.7.0"
